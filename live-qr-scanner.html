<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>QRコード読み取り</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff8e8;
        color: #182335;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 12px 12px, rgba(226, 159, 43, 0.16) 2px, transparent 3px),
          linear-gradient(180deg, #fff8e8 0%, #f9f3e8 100%);
        background-size: 28px 28px, auto;
      }

      main {
        width: min(720px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }

      header,
      section {
        border: 1px solid #f0c66c;
        border-radius: 18px;
        background: rgba(255, 252, 244, 0.94);
        box-shadow: 0 12px 30px rgba(75, 55, 20, 0.08);
      }

      header {
        padding: 18px 20px;
        margin-bottom: 16px;
      }

      p,
      h1 {
        margin: 0;
      }

      .eyebrow {
        color: #0d6f93;
        font-size: 14px;
        font-weight: 700;
      }

      h1 {
        margin-top: 6px;
        font-size: 28px;
        letter-spacing: 0;
      }

      section {
        padding: 16px;
      }

      #reader {
        overflow: hidden;
        min-height: 320px;
        border-radius: 14px;
        background: #111827;
      }

      #reader video {
        border-radius: 14px;
      }

      .message {
        margin-top: 14px;
        white-space: pre-wrap;
        line-height: 1.6;
        font-weight: 700;
      }

      .message.error {
        color: #b42318;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        border-radius: 14px;
        border: 1px solid #0b6687;
        background: #14779a;
        color: #fff;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
      }

      .secondary {
        background: #fffaf0;
        color: #0b4e68;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">棚卸し管理</p>
        <h1>QRコード読み取り</h1>
      </header>

      <section>
        <div id="reader"></div>
        <p id="message" class="message">カメラを起動してください。</p>
        <div class="actions">
          <button id="startButton" type="button">ライブカメラを起動</button>
          <button id="stopButton" class="secondary" type="button">停止</button>
          <a id="backLink" class="secondary" href="#">戻る</a>
        </div>
      </section>
    </main>

    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var returnUrl = params.get('return_url') || '';
        var mode = params.get('mode') || 'search';
        var message = document.getElementById('message');
        var startButton = document.getElementById('startButton');
        var stopButton = document.getElementById('stopButton');
        var backLink = document.getElementById('backLink');
        var scanner = null;
        var running = false;

        backLink.href = returnUrl || 'javascript:history.back()';
        startButton.addEventListener('click', start);
        stopButton.addEventListener('click', stop);

        function start() {
          if (!window.Html5Qrcode) {
            setMessage('QRライブラリを読み込めませんでした。通信状態を確認してください。', true);
            return;
          }
          if (running) return;
          setMessage('ライブカメラを起動しています...', false);
          scanner = new Html5Qrcode('reader');
          scanner.start(
            { facingMode: 'environment' },
            {
              fps: 10,
              qrbox: function(width, height) {
                var edge = Math.min(width || 250, height || 250);
                var size = Math.max(190, Math.min(340, Math.floor(edge * 0.74)));
                return { width: size, height: size };
              },
              aspectRatio: 1.333334,
              rememberLastUsedCamera: true,
            },
            onScanSuccess,
            function() {}
          ).then(function() {
            running = true;
            setMessage('QRコードをカメラに映してください。', false);
          }).catch(function(error) {
            running = false;
            setMessage(buildErrorMessage(error), true);
          });
        }

        function stop() {
          if (!scanner || !running) return;
          scanner.stop().then(function() {
            running = false;
            return scanner.clear();
          }).then(function() {
            setMessage('停止しました。', false);
          }).catch(function() {
            running = false;
          });
        }

        function onScanSuccess(decodedText) {
          if (!decodedText) return;
          setMessage('読み取りました。戻っています...', false);
          var target = buildReturnUrl(decodedText);
          stop();
          window.location.href = target;
        }

        function buildReturnUrl(value) {
          var text = String(value || '').trim();
          var base = returnUrl || '';
          if (!base) {
            return 'https://www.google.com/search?q=' + encodeURIComponent(text);
          }
          if (mode === 'raw') {
            return base + (base.indexOf('?') === -1 ? '?' : '&') + 'qr=' + encodeURIComponent(text);
          }
          return base + (base.indexOf('?') === -1 ? '?' : '&') + 'keyword=' + encodeURIComponent(resolveSearchKeyword(text));
        }

        function resolveSearchKeyword(value) {
          var text = String(value || '').trim();
          try {
            var url = new URL(text);
            var keys = ['jan', 'sku', 'product_id', 'productId', 'keyword', 'q', 'code', 'key'];
            for (var i = 0; i < keys.length; i += 1) {
              var found = url.searchParams.get(keys[i]);
              if (found) return found.trim();
            }
          } catch (error) {}
          return text;
        }

        function buildErrorMessage(error) {
          var name = error && (error.name || error.message) ? String(error.name || error.message) : 'unknown';
          return [
            'ライブカメラを起動できませんでした。',
            'エラー: ' + name,
            '安全な通信: ' + (window.isSecureContext ? 'OK' : 'NG'),
            'ブラウザ: ' + navigator.userAgent,
          ].join('\n');
        }

        function setMessage(text, isError) {
          message.textContent = text || '';
          message.classList.toggle('error', Boolean(isError));
        }
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>QRコード読み取り</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff8e8;
        color: #182335;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 12px 12px, rgba(226, 159, 43, 0.16) 2px, transparent 3px),
          linear-gradient(180deg, #fff8e8 0%, #f9f3e8 100%);
        background-size: 28px 28px, auto;
      }

      main {
        width: min(720px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }

      header,
      section {
        border: 1px solid #f0c66c;
        border-radius: 18px;
        background: rgba(255, 252, 244, 0.94);
        box-shadow: 0 12px 30px rgba(75, 55, 20, 0.08);
      }

      header {
        padding: 18px 20px;
        margin-bottom: 16px;
      }

      p,
      h1 { margin: 0; }

      .eyebrow {
        color: #0d6f93;
        font-size: 14px;
        font-weight: 700;
      }

      h1 {
        margin-top: 6px;
        font-size: 28px;
        letter-spacing: 0;
      }

      section { padding: 16px; }

      #reader {
        overflow: hidden;
        min-height: 330px;
        border-radius: 14px;
        background: #111827;
      }

      #reader video {
        width: 100%;
        border-radius: 14px;
      }

      .message {
        margin-top: 14px;
        white-space: pre-wrap;
        line-height: 1.6;
        font-weight: 700;
      }

      .message.error { color: #b42318; }
      .message.ok { color: #136f43; }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        border-radius: 14px;
        border: 1px solid #0b6687;
        background: #14779a;
        color: #fff;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
      }

      button:disabled {
        opacity: 0.62;
      }

      .secondary {
        background: #fffaf0;
        color: #0b4e68;
      }

      .hint {
        margin-top: 10px;
        color: #5d6676;
        font-size: 14px;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">棚卸し管理</p>
        <h1>QRコード読み取り</h1>
      </header>

      <section>
        <div id="reader"></div>
        <p id="message" class="message">ライブカメラを起動してください。</p>
        <p id="hint" class="hint">QRコードとJANバーコードを読み取れます。iPhoneとAndroidの両方で、背面カメラを優先して起動します。</p>
        <div class="actions">
          <button id="startButton" type="button">ライブカメラを起動</button>
          <button id="retryButton" class="secondary" type="button">別のカメラで再試行</button>
          <button id="stopButton" class="secondary" type="button">停止</button>
          <a id="backLink" class="secondary" href="#">戻る</a>
        </div>
      </section>
    </main>

    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var returnUrl = params.get('return_url') || '';
        var mode = params.get('mode') || 'search';
        var autoStart = params.get('autostart') === '1';
        var message = document.getElementById('message');
        var hint = document.getElementById('hint');
        var startButton = document.getElementById('startButton');
        var retryButton = document.getElementById('retryButton');
        var stopButton = document.getElementById('stopButton');
        var backLink = document.getElementById('backLink');
        var scanner = null;
        var running = false;
        var cameraIndex = 0;
        var lastCameraList = [];
        var starting = false;

        backLink.href = returnUrl || 'javascript:history.back()';
        startButton.addEventListener('click', function() {
          cameraIndex = 0;
          start();
        });
        retryButton.addEventListener('click', function() {
          cameraIndex += 1;
          start();
        });
        stopButton.addEventListener('click', stop);

        setHint();
        if (autoStart) {
          window.setTimeout(start, 250);
        }

        async function start() {
          if (starting) return;
          starting = true;
          startButton.disabled = true;
          retryButton.disabled = true;

          try {
            if (!window.isSecureContext) {
              showRecoverableMessage('安全な通信ではないため、カメラを起動できません。HTTPSのURLで開いてください。');
              return;
            }
            if (!window.Html5Qrcode) {
              showRecoverableMessage('QR読み取り部品を読み込めませんでした。通信状態を確認して、ページを更新してください。');
              return;
            }

            await stopScanner();
            setMessage('ライブカメラを起動しています...', false, false);

            var candidates = await buildCameraCandidates();
            var started = false;
            for (var i = 0; i < candidates.length; i += 1) {
              var candidate = candidates[(cameraIndex + i) % candidates.length];
              try {
                await startWithCandidate(candidate);
                cameraIndex = (cameraIndex + i) % candidates.length;
                started = true;
                break;
              } catch (error) {
                await stopScanner();
              }
            }

            if (!started) {
              showRecoverableMessage(buildCameraHelpText());
            }
          } finally {
            starting = false;
            startButton.disabled = false;
            retryButton.disabled = false;
          }
        }

        async function buildCameraCandidates() {
          var candidates = [];
          lastCameraList = [];

          try {
            lastCameraList = await Html5Qrcode.getCameras();
          } catch (error) {
            lastCameraList = [];
          }

          var rear = lastCameraList.filter(function(camera) {
            return /back|rear|environment|外|背|后|後/i.test(String(camera.label || ''));
          });
          var frontOrUnknown = lastCameraList.filter(function(camera) {
            return rear.indexOf(camera) === -1;
          });

          rear.concat(frontOrUnknown).forEach(function(camera) {
            if (camera && camera.id) {
              candidates.push(camera.id);
            }
          });

          candidates.push({ facingMode: { exact: 'environment' } });
          candidates.push({ facingMode: 'environment' });
          candidates.push({ facingMode: { ideal: 'environment' } });

          return uniqueCandidates(candidates);
        }

        function uniqueCandidates(candidates) {
          var seen = {};
          return candidates.filter(function(candidate) {
            var key = typeof candidate === 'string' ? candidate : JSON.stringify(candidate);
            if (seen[key]) return false;
            seen[key] = true;
            return true;
          });
        }

        async function startWithCandidate(candidate) {
          scanner = new Html5Qrcode('reader', buildScannerOptions());
          await scanner.start(
            candidate,
            {
              fps: 10,
              qrbox: function(width, height) {
                var edge = Math.min(width || 250, height || 250);
                var size = Math.max(190, Math.min(340, Math.floor(edge * 0.74)));
                return { width: size, height: size };
              },
              aspectRatio: 1.333334,
              rememberLastUsedCamera: true,
              experimentalFeatures: {
                useBarCodeDetectorIfSupported: true,
              },
            },
            onScanSuccess,
            function() {}
          );
          running = true;
          setMessage('QRコードをカメラに映してください。', false, true);
        }

        function buildScannerOptions() {
          var supported = window.Html5QrcodeSupportedFormats || {};
          var formats = [
            supported.QR_CODE,
            supported.EAN_13,
            supported.EAN_8,
            supported.CODE_128,
            supported.CODE_39,
            supported.UPC_A,
            supported.UPC_E,
            supported.ITF,
          ].filter(function(format) {
            return format !== undefined && format !== null;
          });

          if (!formats.length) {
            return { verbose: false };
          }
          return {
            verbose: false,
            formatsToSupport: formats,
          };
        }

        async function stop() {
          await stopScanner();
          setMessage('停止しました。', false, false);
        }

        async function stopScanner() {
          if (!scanner) return;
          try {
            if (running) {
              await scanner.stop();
            }
          } catch (error) {}
          try {
            await scanner.clear();
          } catch (error) {}
          scanner = null;
          running = false;
        }

        function onScanSuccess(decodedText) {
          if (!decodedText) return;
          setMessage('読み取りました。戻っています...', false, true);
          var target = buildReturnUrl(decodedText);
          stopScanner().finally(function() {
            window.location.href = target;
          });
        }

        function buildReturnUrl(value) {
          var text = String(value || '').trim();
          var base = returnUrl || '';
          if (!base) {
            return 'https://www.google.com/search?q=' + encodeURIComponent(text);
          }
          if (mode === 'raw') {
            return base + (base.indexOf('?') === -1 ? '?' : '&') + 'qr=' + encodeURIComponent(text);
          }
          return base + (base.indexOf('?') === -1 ? '?' : '&') + 'keyword=' + encodeURIComponent(resolveSearchKeyword(text));
        }

        function resolveSearchKeyword(value) {
          var text = String(value || '').trim();
          try {
            var url = new URL(text);
            var keys = ['jan', 'sku', 'product_id', 'productId', 'keyword', 'q', 'code', 'key'];
            for (var i = 0; i < keys.length; i += 1) {
              var found = url.searchParams.get(keys[i]);
              if (found) return found.trim();
            }
          } catch (error) {}
          return text;
        }

        function buildCameraHelpText() {
          var isiPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
          var isAndroid = /Android/i.test(navigator.userAgent);
          if (isiPhone) {
            return 'ライブカメラを起動できませんでした。SafariまたはChromeのアドレスバー左側の設定から、このサイトのカメラを「許可」にして、ページを更新してください。';
          }
          if (isAndroid) {
            return 'ライブカメラを起動できませんでした。Chromeのサイト設定でカメラを「許可」にして、ページを更新してください。';
          }
          return 'ライブカメラを起動できませんでした。ブラウザのサイト設定でカメラを許可し、ページを更新してください。';
        }

        function setHint() {
          var isiPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
          var isAndroid = /Android/i.test(navigator.userAgent);
          if (isiPhone) {
            hint.textContent = 'iPhoneではSafariまたはChromeで開き、カメラ許可を求められたら「許可」を押してください。';
            return;
          }
          if (isAndroid) {
            hint.textContent = 'AndroidではChromeで開き、カメラ許可を求められたら「許可」を押してください。';
            return;
          }
          hint.textContent = '背面カメラを優先して起動します。';
        }

        function showRecoverableMessage(text) {
          setMessage(text, true, false);
        }

        function setMessage(text, isError, isOk) {
          message.textContent = text || '';
          message.classList.toggle('error', Boolean(isError));
          message.classList.toggle('ok', Boolean(isOk));
        }
      })();
    </script>
  </body>
</html>
